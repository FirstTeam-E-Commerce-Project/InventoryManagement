spring:
  application:
    name: new-inventory-management1
  datasource:
    url: jdbc:postgresql://localhost:8085/new-inventory-management1
    username: product
    password: product

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    register-with-eureka: true
  service-url:
    defaultZone: http://localhost:8761/eureka/

server:
  port: 8085

